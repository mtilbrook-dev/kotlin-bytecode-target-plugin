name: Unit tests

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.user.login == 'mtilbrook-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zulu JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-configuration-cache

